name: jovs_widgets
description: Shared Flutter widgets for the Jov's apps (address picker, future shared UI).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  easy_localization: ^3.0.8
  flutter_map: ^7.0.2
  # Accept both 12 and 13 — host apps resolve to their already-pinned version.
  geolocator: ">=12.0.0 <14.0.0"
  http: ^1.2.2
  intl: ">=0.19.0 <0.21.0"
  intl_phone_field: ^3.2.0
  latlong2: ^0.9.1
  # Package publié par Franck sur pub.dev il y a 3 ans, cloné localement
  # pour itérer sans friction. À republier sur pub.dev plus tard (voir
  # a-faire-plus-tard.md). Dataset mondial : 246 pays, ~48k villes.
  custom_country_state_city:
    git:
      url: https://github.com/TchatchoKemajou/custom_country_state_city.git
      ref: f4fb119e47ac04a449a72335e74398e286ef6fbe

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
