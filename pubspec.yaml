name: jovs_widgets
description: Shared Flutter widgets for the Jov's apps (address picker, future shared UI).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  easy_localization: ^3.0.8
  flutter_map: ^7.0.2
  geolocator: ^12.0.0
  http: ^1.2.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
